/* ============ ESTADO ============ */
var state={};

function loadRecord(mode){
    var key='mg_survival_record_'+(mode||'normal');
    document.getElementById('recordDays').textContent=localStorage.getItem(key)||'0';
    document.getElementById('totalGames').textContent=localStorage.getItem('mg_survival_games_'+(mode||'normal'))||'0';
}
function saveRecord(dias){
    var mode=state.gameMode||'normal';
    var key='mg_survival_record_'+mode;
    var gamesKey='mg_survival_games_'+mode;
    var r=parseInt(localStorage.getItem(key)||'0');
    var g=parseInt(localStorage.getItem(gamesKey)||'0');
    if(dias>r)localStorage.setItem(key,dias);
    localStorage.setItem(gamesKey,g+1);
    loadRecord(mode);
}

/* ============ COMBATE ============ */
function startCombat(forceEnemyId){
    var posibles=ZONE_ENEMIES[state.zone]||[];
    if(posibles.length===0)return false;
    var id=forceEnemyId||posibles[Math.floor(Math.random()*posibles.length)];
    var base=ENEMIES[id];
    var scale=1+(state.nivel-1)*.15;
    var hp=Math.round(base.hp*scale);
    state.combat={id:id,name:base.name,icon:base.icon,hp:hp,maxHp:hp,atk:Math.round(base.atk*scale),xp:base.xp,loot:base.loot,lootN:base.lootN,venom:base.venom||false,human:base.human||false,boss:base.boss||false};
    updateLog("⚔️ ¡COMBATE! Un "+base.name+" "+base.icon+" te ataca!","combat");
    renderGame();return true;
}
function combatAttack(){
    var e=state.combat;if(!e)return;
    var hit=Math.min(.95,.75+state.nivel*.02);
    var crit=.15+state.suerte*.02;
    var log='';
    if(roll(hit)){
        var dmg=8+state.nivel*2;
        if(state.inv.armaFuego&&state.inv.balas>0){dmg+=15;state.inv.balas--;state.inv.durabilidadArma--;if(state.inv.durabilidadArma<=0){state.inv.armaFuego=false;log+='¡Arma rota! '}}
        else if(state.inv.lanza){dmg+=10;state.inv.durabilidadLanza--;if(state.inv.venenoLanza)dmg+=5;if(state.inv.durabilidadLanza<=0){state.inv.lanza=false;state.inv.venenoLanza=false;log+='¡Lanza rota! '}}
        else{dmg+=2}
        if(Math.random()<crit){dmg=Math.round(dmg*2);log+='¡CRÍTICO! '}
        e.hp-=dmg;log+='Le hiciste '+dmg+' daño. ';
        if(e.hp<=0){killEnemy();return}
    }else log+='¡Fallaste! ';
    var ed=e.atk+Math.floor(Math.random()*5)-2;
    if(e.venom&&Math.random()<.3){state.condiciones.veneno=1;log+='¡Te envenenó! '}
    state.hp-=ed;log+='El '+e.name+' te hizo '+ed+' daño.';
    if(state.hp<=0){endGame('dead');return}
    updateLog(log,'combat');renderGame();
}
function combatDefend(){
    var e=state.combat;if(!e)return;
    var ed=Math.round((e.atk+Math.floor(Math.random()*5)-2)*.5);
    state.hp-=ed;
    if(state.hp<=0){endGame('dead');return}
    updateLog("Te defiendes. Solo recibiste "+ed+" daño.",'combat');renderGame();
}
function combatFlee(){
    var e=state.combat;if(!e)return;
    if(roll(.5)){state.combat=null;updateLog("Lograste huir.","good");renderGame()}
    else{var ed=e.atk+Math.floor(Math.random()*5)-2;state.hp-=ed;updateLog("¡No pudiste huir! "+ed+" daño.","bad");if(state.hp<=0){endGame('dead');return}renderGame()}
}
function combatHeal(){
    if(state.inv.medicina<=0)return;
    state.inv.medicina--;state.hp=Math.min(100,state.hp+40);
    var e=state.combat;
    if(e){var ed=e.atk+Math.floor(Math.random()*5)-2;state.hp-=ed;updateLog("Medicina (+40 HP). El "+e.name+" te hizo "+ed+" daño.","good");if(state.hp<=0){endGame('dead');return}}
    renderGame();
}
function killEnemy(){
    var e=state.combat;
    var log='¡Mataste al '+e.name+'! +'+e.xp+' XP';
    state.xp+=e.xp;
    if(!state.firstBlood){state.firstBlood=true;unlockAchievement("first_blood")}
    if(e.boss)unlockAchievement("boss_slayer");
    if(e.loot){
        var n=e.lootN||1;
        if(e.loot==='armaFuego'){state.inv.armaFuego=true;state.inv.balas=(state.inv.balas||0)+10;log+=' ¡Arma +10 balas!'}
        else if(e.loot==='dienteTiburon'){state.inv.dienteTiburon=true;log+=' ¡Diente!'}
        else if(e.loot==='venenoLanza'){state.inv.venenoLanza=true;log+=' ¡Veneno!'}
        else if(e.loot==='antidoto'){state.inv.antidoto=(state.inv.antidoto||0)+n;log+=' +'+n+' antídoto'}
        else{state.inv[e.loot]=(state.inv[e.loot]||0)+n;log+=' +'+n+' '+e.loot}
    }
    if(e.boss){state.suerte=Math.min(5,state.suerte+2);log+=' +2 Suerte'}
    state.combat=null;checkLevelUp();updateLog(log,"good");renderGame();
}
function checkLevelUp(){
    var need=state.nivel*100;
    while(state.xp>=need){
        state.xp-=need;state.nivel++;
        state.hp=100;state.hambre=100;state.sed=100;state.energia=100;state.sueno=100;
        updateLog("🎉 ¡SUBISTE A NIVEL "+state.nivel+"!","good");
        if(state.nivel>=10)unlockAchievement("veteran");
        need=state.nivel*100;
    }
}

/* ============ ACCIÓN ============ */
function doAction(idx){
    var result=ZONES[state.zone].options[idx].fn(state);
    if(state.visitedZones.indexOf(state.zone)<0){state.visitedZones.push(state.zone);if(state.visitedZones.length>=10)unlockAchievement("explorer")}
    state.dia++;
    state.timeIdx=(state.timeIdx+1)%TIMES.length;
    state.weatherDays--;
    if(state.weatherDays<=0){state.weatherIdx=Math.floor(Math.random()*WEATHERS.length);state.weatherDays=2+Math.floor(Math.random()*3)}
    var weather=WEATHERS[state.weatherIdx];
    var mode=GAME_MODES[state.gameMode]||GAME_MODES.normal;
    var hd=(11+Math.random()*8)*mode.hungerMult;
    var td=(14+Math.random()*9)*mode.hungerMult;
    if(weather.name==="Ola de calor")td*=1.6;
    if(weather.name==="Ola de frío")hd*=1.3;
    state.hambre=Math.max(0,state.hambre-hd);
    state.sed=Math.max(0,state.sed-td);
    state.energia=Math.max(0,state.energia-(5+Math.random()*5));
    state.sueno=Math.max(0,state.sueno-(6+Math.random()*6));
    var zt=ZONES[state.zone].temp+weather.temp;
    if(zt<5)state.condiciones.hipotermia=1;else if(zt>38)state.condiciones.insolacion=1;
    if(state.inv.cabana)state.hp=Math.min(100,state.hp+5);
    if(state.buildings.enfermeria)state.hp=Math.min(100,state.hp+5);
    if(state.hambre<=0)state.hp-=16;
    if(state.sed<=0)state.hp-=20;
    if(state.energia<=0)state.hp-=8;
    if(state.sueno<=0)state.hp-=8;
    if(state.hambre<20&&state.inv.comida>0){state.inv.comida--;var fr=state.inv.comidaCocida?50:35;state.hambre=Math.min(100,state.hambre+fr)}
    if(state.sed<20&&state.inv.agua>0){state.inv.agua--;state.sed=Math.min(100,state.sed+40)}
    if(state.buildings.huerto&&state.dia%4===0)state.inv.comida+=2;
    if(state.buildings.corral)state.inv.comida+=1;
    if(state.buildings.enfermeria&&Math.random()<.5){state.condiciones.infeccion=0;state.condiciones.sangrado=0}
    if(state.companion==='mono'&&state.dia%3===0)state.inv.comida++;
    var condDmg='';
    CONDITIONS.forEach(function(c){if(state.condiciones[c.id]>0){state.hp-=c.dmg;condDmg+=' '+c.icon}});
    var evMsg='';
    RANDOM_EVENTS.forEach(function(ev){
        if(Math.random()<ev.chance){
            var r=ev.fn(state);
            if(state.inv.cabana&&ev.cabin)ev.cabin(state);
            if(r)evMsg+=' | '+r+(state.inv.cabana&&ev.cabinMsg?ev.cabinMsg:'');
        }
    });
    state.xp+=2;
    if(result.xp)state.xp+=result.xp;
    var need=state.nivel*100;
    if(state.xp>=need){state.xp-=need;state.nivel++;state.hp=100;state.hambre=100;state.sed=100;state.energia=100;state.sueno=100;evMsg+=' | 🎉 ¡NIVEL '+state.nivel+'!';if(state.nivel>=10)unlockAchievement("veteran")}
    state.hp=Math.max(0,Math.min(100,state.hp));
    var logMsg=result.msg;
    if(evMsg)logMsg+='<br><span class="event">'+evMsg.substring(3)+'</span>';
    if(condDmg)logMsg+='<br><span class="cond">Daño condiciones:'+condDmg+'</span>';
    if(state.hp<25)logMsg+=' <span class="bad">HP CRÍTICO!</span>';
    document.getElementById("log").innerHTML='<span class="'+result.cls+'">'+logMsg+'</span>';
    if(state.dia>=20)unlockAchievement("survivor20");
    if((state.inv.oro||0)>=50)unlockAchievement("rich");
    if(state.diariesFound>=5)unlockAchievement("librarian");
    if(state.hp<=0){endGame('dead');return}
    if(state.escaped){unlockAchievement("escaped");endGame('escape');return}
    if(state.rescate===1){state.rescate=2;renderGame();return}
    if(state.rescate===2){unlockAchievement("rescued");endGame('rescue');return}
    if(result.trigger==="combat"){startCombat(result.forceEnemy);return}
    if(state.pendingNPC){renderGame();return}
    renderGame();
}

function updateLog(msg,cls){document.getElementById("log").innerHTML='<span class="'+cls+'">'+msg+'</span>'}

/* ============ MISIONES Y LOGROS ============ */
function checkQuests(){
    QUESTS.forEach(function(q){
        if(!state.questsDone[q.id]&&q.check(state)){
            state.questsDone[q.id]=true;
            if(q.reward.xp)state.xp+=q.reward.xp;
            showToast("🎯 Misión: "+q.title);
        }
    });
}
function unlockAchievement(id){
    if(state.achievements[id])return;
    state.achievements[id]=true;
    var a=ACHIEVEMENTS.find(function(x){return x.id===id});
    if(a)setTimeout(function(){showToast("🏆 Logro: "+a.name)},300);
}
function showToast(msg){
    var t=document.createElement('div');
    t.style.cssText='position:fixed;top:80px;right:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.5)';
    t.textContent=msg;document.body.appendChild(t);
    setTimeout(function(){t.remove()},3500);
}

/* ============ MODALES ============ */
function openModal(title,html){
    document.getElementById('modalTitle').textContent=title;
    document.getElementById('modalBody').innerHTML=html;
    document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

function openJournal(){
    var html='<p style="color:#7070a0;margin-bottom:15px;font-size:.88em">Diarios: <b style="color:#22d3ee">'+state.diariesFound+'/'+DIARIES.length+'</b></p>';
    DIARIES.forEach(function(d){
        if(d.unlocked)html+='<div class="lore-item"><b style="color:#a78bfa">📖 '+d.title+'</b><br>'+d.text+'</div>';
        else html+='<div class="lore-item" style="opacity:.4">🔒 <b>'+d.title+'</b><br><i>No descubierto...</i></div>';
    });
    openModal("📖 Diario",html);
}
function openBuild(){
    var html='';
    BUILDINGS.forEach(function(b){
        var count=state.buildings[b.id]||0;
        var maxed=b.max&&count>=b.max;
        var canBuild=!maxed&&!(b.repeat===false&&count>0);
        var costStr=Object.keys(b.cost).map(function(k){return k+': '+b.cost[k]}).join(' · ');
        var hasAll=Object.keys(b.cost).every(function(k){return (state.inv[k]||0)>=b.cost[k]});
        html+='<div class="build-item"><span class="b-icon">'+b.icon+'</span><div class="b-info"><div class="q-title">'+b.name+(count>0?' (x'+count+')':'')+'</div><div class="b-desc">'+b.desc+'</div><div class="b-cost">'+costStr+'</div></div>';
        if(canBuild)html+='<button class="build-btn" '+(hasAll?'':'disabled')+' onclick="buildIt(\''+b.id+'\')">Construir</button>';
        else html+='<span style="color:#4ade80;font-size:1.2em">✓</span>';
        html+='</div>';
    });
    openModal("🔨 Construcciones",html);
}
function buildIt(id){
    var b=BUILDINGS.find(function(x){return x.id===id});
    if(!b)return;
    var hasAll=Object.keys(b.cost).every(function(k){return (state.inv[k]||0)>=b.cost[k]});
    if(!hasAll)return;
    Object.keys(b.cost).forEach(function(k){state.inv[k]-=b.cost[k]});
    state.buildings[b.id]=(state.buildings[b.id]||0)+1;
    state.inv['building_'+b.id]=true;
    if(b.id==='cabana'){state.inv.cabana=true;unlockAchievement("builder")}
    if(b.id==='huerto')unlockAchievement("farmer");
    updateLog("🔨 Construiste: "+b.name,"good");
    closeModal();renderGame();
}
function openQuests(){
    var html='<h3 style="color:#4ade80;font-size:.95em;margin-bottom:10px">MISIONES PRINCIPALES</h3>';
    QUESTS.filter(function(q){return q.main}).forEach(function(q){
        var done=state.questsDone[q.id];
        html+='<div class="quest-item'+(done?' done':'')+'"><span class="q-icon">'+q.icon+'</span><div class="q-info"><div class="q-title">'+q.title+'</div><div class="q-desc">'+q.desc+'</div></div><span class="q-status">'+(done?'✅':'⏳')+'</span></div>';
    });
    html+='<h3 style="color:#22d3ee;font-size:.95em;margin:15px 0 10px">SECUNDARIAS</h3>';
    QUESTS.filter(function(q){return !q.main}).forEach(function(q){
        var done=state.questsDone[q.id];
        html+='<div class="quest-item'+(done?' done':'')+'"><span class="q-icon">'+q.icon+'</span><div class="q-info"><div class="q-title">'+q.title+'</div><div class="q-desc">'+q.desc+'</div></div><span class="q-status">'+(done?'✅':'⏳')+'</span></div>';
    });
    openModal("📜 Misiones",html);
}
function openAchievements(){
    var html='<p style="color:#7070a0;margin-bottom:15px;font-size:.88em">Desbloqueados: <b style="color:#fbbf24">'+Object.keys(state.achievements).length+'/'+ACHIEVEMENTS.length+'</b></p>';
    ACHIEVEMENTS.forEach(function(a){
        var u=state.achievements[a.id];
        html+='<div class="achieve-item '+(u?'unlocked':'locked')+'"><span class="a-icon">'+a.icon+'</span><div class="a-info"><div class="q-title">'+a.name+'</div><div class="q-desc">'+a.desc+'</div></div>'+(u?'<span style="color:#4ade80">✓</span>':'')+'</div>';
    });
    openModal("🏆 Logros",html);
}
function openCompanions(){
    var html='';
    if(state.companion){
        var c=COMPANIONS[state.companion];
        html+='<div style="padding:20px;background:rgba(74,222,128,.1);border:1px solid #4ade80;border-radius:12px;text-align:center;margin-bottom:20px"><div style="font-size:3em">'+c.icon+'</div><div style="font-weight:700;font-size:1.2em;margin-top:10px">'+c.name+'</div><div style="color:#c0c0e0;font-size:.88em;margin-top:5px">'+c.desc+'</div></div>';
        html+='<button class="build-btn" onclick="abandonCompanion()">Abandonar</button>';
    }else{
        html+='<p style="color:#7070a0;margin-bottom:15px;font-size:.9em">Adopta un compañero.</p>';
        Object.keys(COMPANIONS).forEach(function(k){
            var c=COMPANIONS[k];
            var costStr=Object.keys(c.cost).map(function(x){return c.cost[x]+' '+x}).join(', ');
            var hasAll=Object.keys(c.cost).every(function(x){return (state.inv[x]||0)>=c.cost[x]});
            html+='<div class="build-item"><span class="b-icon">'+c.icon+'</span><div class="b-info"><div class="q-title">'+c.name+'</div><div class="b-desc">'+c.desc+'</div><div class="b-cost">Cuesta: '+costStr+'</div></div><button class="build-btn" '+(hasAll?'':'disabled')+' onclick="adoptCompanion(\''+k+'\')">Adoptar</button></div>';
        });
    }
    openModal("🐕 Compañeros",html);
}
function adoptCompanion(k){
    var c=COMPANIONS[k];
    var hasAll=Object.keys(c.cost).every(function(x){return (state.inv[x]||0)>=c.cost[x]});
    if(!hasAll)return;
    Object.keys(c.cost).forEach(function(x){state.inv[x]-=c.cost[x]});
    state.companion=k;unlockAchievement("companion");
    updateLog("🐾 Adoptaste un "+c.name+"!","good");
    closeModal();renderGame();
}
function abandonCompanion(){state.companion=null;closeModal();renderGame()}

/* ============ FIN ============ */
function endGame(type){
    var ov=document.getElementById("overlay");
    ov.className="show";
    var dias=state.dia-1;
    saveRecord(dias);
    var allMain=QUESTS.filter(function(q){return q.main}).every(function(q){return state.questsDone[q.id]});
    if(type==='dead'){
        ov.classList.add("dead");
        document.getElementById("oTitle").textContent="HAS MUERTO";
        document.getElementById("oMsg").textContent="Sobreviviste "+dias+" días.";
        var causas=[];
        if(state.hambre<=0)causas.push("Hambre");
        if(state.sed<=0)causas.push("Sed");
        if(state.combat)causas.push("Combate con "+state.combat.name);
        CONDITIONS.forEach(function(c){if(state.condiciones[c.id]>0)causas.push(c.name)});
        if(causas.length===0)causas.push("Heridas");
        document.getElementById("oDetail").innerHTML="Causa: "+causas.join(", ")+"<br>Nivel: "+state.nivel+"<br>Días: "+dias+"<br>Logros: "+Object.keys(state.achievements).length+"/"+ACHIEVEMENTS.length;
        document.getElementById("oButtons").innerHTML='<button onclick="retry()">REINTENTAR</button><button onclick="showModePicker()">CAMBIAR MODO</button>';
    }else if(type==='rescue'){
        ov.classList.add("win");
        document.getElementById("oTitle").textContent="RESCATADO!";
        document.getElementById("oMsg").textContent="Un barco te rescató el día "+dias+".";
        document.getElementById("oDetail").innerHTML="Método: Radio/faro<br>Nivel: "+state.nivel+"<br>Logros: "+Object.keys(state.achievements).length+"/"+ACHIEVEMENTS.length;
        document.getElementById("oButtons").innerHTML='<button onclick="retry()">REINTENTAR</button>';
    }else if(type==='escape'){
        if(allMain){
            ov.classList.add("true-end");
            document.getElementById("oTitle").textContent="FINAL VERDADERO 🎖️";
            document.getElementById("oMsg").textContent="¡Escapaste Y descubriste el misterio!";
            document.getElementById("oDetail").innerHTML="Completaste todas las misiones.<br>Días: "+dias+" · Nivel: "+state.nivel+"<br>¡Eres una leyenda!";
        }else{
            ov.classList.add("win");
            document.getElementById("oTitle").textContent="ESCAPASTE!";
            document.getElementById("oMsg").textContent="Navegaste a tierra firme el día "+dias+".";
            document.getElementById("oDetail").innerHTML="Método: Balsa/barco<br>Nivel: "+state.nivel;
        }
        document.getElementById("oButtons").innerHTML='<button onclick="retry()">REINTENTAR</button>';
    }
}
function retry(){document.getElementById("overlay").className="";resetGame(true)}

/* ============ INICIO ============ */
loadRecord('normal');
showModePicker();
</script>
