<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WoodvsBox</title>
<style>
:root{--bg:#05060c;--panel:rgba(10,11,22,.95);--fg:#fff;--cy:#00f2fe;--pk:#ff007f;--gd:#ffd700;--gr:#39ff14;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at center,#111424,var(--bg));color:var(--fg);font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
h1{margin:0;font-size:clamp(18px,4vw,30px);letter-spacing:4px;background:linear-gradient(135deg,var(--cy),#4facfe);-webkit-background-clip:text;background-clip:text;color:transparent}
#wrap{position:relative;width:min(calc(100vw - 12px),900px,calc((100vh - 60px) * 1.8));aspect-ratio:9/5;border:3px solid var(--cy);border-radius:14px;box-shadow:0 0 30px rgba(0,242,254,.3);overflow:hidden;background:#0f101b}
#wrap:fullscreen{display:flex;align-items:center;justify-content:center;border:0;border-radius:0;background:#000}
#wrap:fullscreen canvas{width:min(100vw,calc(100vh * 1.8));height:auto;aspect-ratio:9/5}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--panel);padding:10px;text-align:center;z-index:10}
.ov.on{display:flex}
.ov h2{margin:0;font-size:clamp(22px,5vw,44px);letter-spacing:3px}
.ov p{margin:0;font-size:clamp(12px,2vw,17px);color:#cfd6ff}
.b{background:rgba(26,28,46,.9);color:var(--fg);border:2px solid var(--cy);border-radius:10px;padding:9px 22px;font:700 clamp(12px,2vw,15px) inherit;font-family:inherit;cursor:pointer;min-width:200px;letter-spacing:1px}
.b:hover:not(:disabled){background:var(--cy);color:#05060c}
.b:disabled{opacity:.5;cursor:default}
.b.eq{border-color:var(--pk);color:var(--pk)}
.hb{position:absolute;top:6px;right:6px;display:flex;gap:6px;z-index:5}
.hb button{width:36px;height:36px;border-radius:50%;border:2px solid var(--cy);background:rgba(10,11,22,.7);color:var(--fg);font-size:16px;cursor:pointer}
#shop{justify-content:flex-start}
.sh{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:800}
.coin{color:var(--gd);border:1px solid rgba(255,215,0,.3);border-radius:16px;padding:3px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;overflow:auto;width:100%;flex:1;min-height:0}
.it{background:#171a30;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;justify-content:space-between;font-size:12px}
.it .n{font-weight:800;text-transform:uppercase}
.it .b{min-width:0;padding:5px;font-size:11px}
.pv{width:100%;height:auto;aspect-ratio:5/2;background:radial-gradient(circle,#1b1f3a,#0b0d1c);border-radius:8px}
#dv{display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
#dv.on{display:flex}
#dv input{width:90px;padding:6px;border-radius:6px;border:1px solid var(--gr);background:#15172b;color:var(--gr)}
#dv .b{min-width:0;padding:6px 12px;border-color:var(--gr);color:var(--gr)}
#dt{display:none;gap:6px}
#dt.on{display:flex}
#lo{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(0,242,254,.25);border-radius:10px;padding:6px 10px;max-width:92%;text-align:left}
#lo canvas{width:110px;height:auto;aspect-ratio:5/2;flex:none}
#lot{font-size:clamp(10px,1.7vw,13px);line-height:1.45;color:#cfd6ff}
#mb{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(100%,430px)}
#mb .b{min-width:0;width:100%;padding:8px 6px}
#pfb{position:absolute;top:8px;left:8px;width:46px;height:46px;border-radius:50%;border:2px solid var(--cy);background:#0d0f1f;padding:0;cursor:pointer;overflow:hidden}
#pfb canvas{width:100%;height:100%;display:block}
#pname,#pfav,#pwep,#pchr{width:100%;padding:6px;border-radius:8px;border:1px solid var(--cy);background:#15172b;color:#fff;font:inherit}
.tb{min-width:0;padding:5px 14px}
.tb.on{background:var(--cy);color:#05060c}
.pst div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:clamp(11px,1.8vw,14px)}
#ach{justify-content:flex-start}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%) translateY(-70px);background:rgba(10,11,22,.95);border:2px solid var(--gd);color:var(--gd);padding:8px 16px;border-radius:12px;z-index:30;font-weight:800;transition:transform .35s;pointer-events:none;white-space:nowrap;font-size:clamp(11px,2vw,15px)}
#toast.on{transform:translateX(-50%) translateY(0)}
.tg{display:inline-block;border:1px solid var(--gd);color:var(--gd);border-radius:10px;padding:0 7px;margin:2px 4px 0 0}
</style></head>
<body>
<h1>WOODvsBOX</h1>
<div id="wrap">
<canvas id="c" width="900" height="500"></canvas>
<div class="hb"><button id="pause" title="Pausa (W)">⏸</button><button id="mute" title="Sonido (M)">🔊</button><button id="mus" title="Música">🎵</button><button id="hch" title="Mostrar/ocultar personaje">🎭</button></div>

<span id="dt"><button class="b" id="d1">+3.000 🪙</button><button class="b" id="d3">+1M 🪙</button><button class="b" id="d4">+1 billón 🪙</button><button class="b" id="d2">Invencible: no</button></span></div>

</div>

<div class="ov" id="over">

<p id="os"></p>
<button class="b" id="again">REINTENTAR</button>

<div class="ov" id="ach">
<div class="sh"><span></span><span style="font-size:clamp(18px,3vw,28px);color:var(--gd);letter-spacing:3px">LOGROS</span><span class="coin"><b id="acn">0</b></span></div>
<div class="grid" id="agrid"></div>
<button class="b" id="achx">VOLVER AL MENÚ</button>

<div style="display:flex;gap:12px;width:100%;flex:1;min-height:0;overflow:auto;text-align:left">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:140px;flex:none"><canvas id="pfa" width="120" height="120" style="width:110px;height:110px;border-radius:50%;border:3px solid var(--cy)"></canvas><input id="pname" maxlength="16" placeholder="Tu nombre"><select id="pfav"></select><small style="color:#aab">Foto = arco favorito</small><small style="color:#aab;margin-top:6px">⚔️ Arma equipada</small><select id="pwep"></select><small style="color:#aab">🎭 Personaje</small><select id="pchr"></select><button class="b" id="phide" style="min-width:0;padding:5px 8px;font-size:11px;width:100%"></button></div>
<div class="pst" id="pst" style="flex:1"></div></div>
<button class="b" id="pfx">VOLVER AL MENÚ</button>
</div>
<div class="ov" id="lbo">
<div class="sh"><span></span><span style="font-size:clamp(18px,3vw,28px);color:var(--gd);letter-spacing:3px">CLASIFICACIÓN</span><span class="coin" id="lbs">...</span></div>
<div style="display:flex;gap:6px"><button class="b tb on" data-f="s">Puntos</button><button class="b tb" data-f="c">Monedas</button><button class="b tb" data-f="w">Oleada</button></div>
<div class="grid" id="lbl" style="display:block"></div>
<button class="b" id="lbx">VOLVER AL MENÚ</button>
</div>
<div id="toast"></div>
<div class="ov" id="shop">
<div class="sh"><span></span><span style="font-size:clamp(18px,3vw,28px);color:var(--pk);letter-spacing:3px">TIENDA</span><span class="coin"><b id="sc">0</b> 🪙</span></div>
<div class="grid" id="grid"></div>
<button class="b" id="shopx">VOLVER AL MENÚ</button>
</div>
</div>

<script>
const $=s=>document.querySelector(s),C=$('#c'),X=C.getContext('2d'),W=900,H=500;
const SK=[['arco_madera','Arco Madera','#8B5A2B'],['neon_cyan','Arco Neón','#00f2fe'],['laser_pink','Cyber Rosa','#ff007f'],['acid_green','Verde Tóxico','#39ff14'],['plasma_purple','Plasma Violeta','#9b59b6'],['solar_orange','Fuego Solar','#ffaa00'],['gold_vip','Arco de Oro','#ffd700'],['ice_blue','Glacial','#a5f2f3'],['quantum_red','Láser Carmesí','#ff4757'],['cyber_ghost','Espectro Blanco','#ffffff'],['radioactive','Radiactivo','#ccff00'],['void_star','Arco del Vacío','#7b00ff']];
const ITEMS=SK.map((s,i)=>({id:s[0],name:s[1],color:s[2],type:'skin',price:i*20}));
ITEMS.push({id:'bot_1',name:'🤖 Ultra Bot 1',color:'#ff4500',type:'skin',price:100000,desc:'INMORTAL. Dispara solo: ráfaga de 8 flechas.'},
{id:'sonic_bow',name:'🦔 Erizo Veloz',color:'#0044ff',type:'skin',only:'char_baby',price:600,desc:'Ralentiza el tiempo, munición infinita y velocidad extrema.'},
{id:'triple_shot',name:'Disparo Triple',type:'up',price:250,desc:'Tres flechas por disparo.'},
{id:'shield',name:'Escudo de Energía',type:'up',price:200,desc:'Bloquea un golpe por partida.'});
const find=id=>ITEMS.find(i=>i.id===id);
const AB={arco_madera:'Robusto: empiezas con +20 flechas.',neon_cyan:'Cadencia: dispara un 30% más rápido.',laser_pink:'Perforante: la flecha atraviesa una caja.',acid_green:'Veneno: las cajas dañadas pierden vida con el tiempo.',plasma_purple:'Explosión: al romper una caja daña a las cercanas.',solar_orange:'Quemadura: incendia las cajas y sus bajas suben el combo.',gold_vip:'Midas: ganas un 50% más de monedas.',ice_blue:'Hielo: ralentiza las cajas; con combo x3 las congela.',quantum_red:'Crítico: 20% de flechas hacen doble daño.',cyber_ghost:'Fantasma: esquivas el primer golpe de cada oleada.',radioactive:'Rebote: las flechas rebotan una vez en los bordes.',void_star:'Vacío: cada 8 bajas golpea a todas las cajas.'};
ITEMS.forEach(i=>{if(AB[i.id])i.desc=AB[i.id]});
ITEMS.splice(ITEMS.findIndex(i=>i.id==='triple_shot'),0,{id:'bot_2',name:'🤖 Bot 2.0',color:'#ffe14d',type:'skin',price:20000000000000,desc:'TODAS las habilidades: inmortal, auto-disparo, tiempo lento, veneno, fuego, hielo, crítico, explosión, vacío y más.'});
ITEMS.splice(ITEMS.findIndex(i=>i.id==='triple_shot'),0,{id:'bazooka',name:'🚀 Bazooka',color:'#ff9a00',type:'skin',price:55000000,desc:'Cohete que atraviesa todas las cajas y revienta hasta 400 a su alrededor. Munición infinita y 134 vidas.'});
ITEMS.splice(ITEMS.findIndex(i=>i.id==='triple_shot'),0,{id:'taco_bam',name:'🌮 Taco Bam',color:'#ffb703',type:'skin',price:155000000,desc:'Un clic = ¡BIG BAM! Destruye todas las cajas durante 15 oleadas y el tiempo corre x100.000. Munición infinita.'});
ITEMS.splice(1,0,{id:'capibara',name:'Capibara',color:'#b5835a',type:'skin',price:0,desc:'Robusto: +20 flechas. Lanza cactus y cocos.'});
ITEMS.splice(ITEMS.findIndex(i=>i.id==='triple_shot'),0,{id:'boomerang',name:'🪃 Boomerang',color:'#e0a040',type:'skin',price:150,desc:'Un boomerang de verdad: lo lanzas, vuelve y lo recoges.'},{id:'baby_sonic',name:'🦔 Erizo Bebé',color:'#33a1ff',type:'skin',price:1500000,desc:'Teletránsportate al cursor con un clic. Rebota en las paredes, gana velocidad y se vuelve imparable. Munición y vidas infinitas.'},{id:'mini_chef',name:'👨‍🍳 Mini Chef',color:'#ffd9a0',type:'skin',price:8000000,desc:'Lanza tortitas y gofres. Cada baja multiplica las monedas de forma exponencial.'},{id:'tank',name:'🪖 Tanque de Guerra',color:'#6b8e23',type:'skin',price:800000000,desc:'EL MEJOR ARMA: obuses que arrasan la pantalla, ametralladora automática, todas las habilidades, vidas y munición infinitas.'});
ITEMS.splice(ITEMS.findIndex(i=>i.id==='triple_shot'),0,{id:'pickaxe',name:'⛏️ Pico de Diamante',color:'#4dd0e1',type:'skin',price:2500000,desc:'Lánzalo: rebota por toda la pantalla atravesando cajas. Haz clic para teletransportarlo al cursor.'});
ITEMS.splice(ITEMS.findIndex(i=>i.id==='triple_shot'),0,{id:'azulina',name:'👼 Azulina Divina',color:'#59b6ff',type:'skin',price:50000000000000,desc:'Fusión divina: teletransporte al cursor, rayos láser permanentes que lo deshacen todo, bazooka automática y todas las habilidades. Sin rebotes.'});
ITEMS.splice(ITEMS.findIndex(i=>i.id==='triple_shot'),0,{id:'char_bosque',name:'🧝 Arquero del Bosque',color:'#3fae49',type:'char',price:1000000000,desc:'El más caro. Mejora MUCHO todas las estadísticas: +20 vidas y +1 por oleada, daño x3, cadencia x2, flechas más rápidas que atraviesan una caja, +70% de velocidad, más munición, monedas y puntos x2 y recibe un tercio del daño. Puede llevar cualquier arma y es el único que porta el Arco Legendario.'},{id:'char_azulina',name:'💙 Azulina',color:'#5ec2ff',type:'char',price:500000000,tag:'Javi',desc:'Mini personaje con name tag "Javi". Puede llevar cualquier arma.'},{id:'char_chef',name:'🧑‍🍳 Chef Arquero',color:'#f5f5f5',type:'char',price:350000000,desc:'Mini chef arquero. Puede llevar cualquier arma.'});
ITEMS.splice(ITEMS.findIndex(i=>i.id==='triple_shot'),0,{id:'char_baby',name:'🦔 Erizo Bebé Arquero',color:'#33a1ff',type:'char',price:450000000,desc:'Mini erizo azul arquero. Puede llevar cualquier arma.'},{id:'legend_bow',name:'🏹 Arco Legendario',color:'#7cfc00',type:'skin',only:'char_bosque',price:30000000000000,desc:'SOLO para el Arquero del Bosque. Fusión Erizo Bebé + Bot 2.0: teletransporte, auto-disparo, todas las habilidades, vidas y munición infinitas. Sin rebotes. Con Link: daño x3 extra (x9 a jefes más) y dispara 3,5 veces más rápido.'});
const has=id=>p.id===id||p.id==='bot_2'||(id==='sonic_bow'&&p.id==='baby_sonic')||(p.id==='tank'&&id!=='sonic_bow')||p.id==='azulina'||p.id==='legend_bow',bt=()=>p.id==='bot_1'||p.id==='bot_2'||p.id==='azulina'||p.id==='legend_bow',bh=(b,id)=>b.id===id||b.id==='bot_2'||b.id==='tank'||b.id==='legend_bow',inf=()=>bt()||has('sonic_bow')||p.id==='bazooka'||p.id==='taco_bam'||p.id==='tank';
const imp=()=>p.id==='baby_sonic'&&bnc>=6;
const link=()=>!!p&&p.ch==='char_bosque';
const afk=()=>!!p&&(p.id==='bot_2'||(p.id==='legend_bow'&&p.ch==='char_bosque'));

let D={coins:0,highScore:0,unlockedItems:['arco_madera'],equippedSkin:'arco_madera'};
try{Object.assign(D,JSON.parse(localStorage.getItem('woodvsbox_data')||'{}'))}catch(e){}
if(!find(D.equippedSkin))D.equippedSkin='arco_madera';
if(D.equippedChar&&!find(D.equippedChar))D.equippedChar=null;
if(!D.unlockedItems.includes('capibara'))D.unlockedItems.push('capibara');
D.st=Object.assign({k:0,b:0,r:0,w:0,cb:0,t:0},D.st);D.ach=D.ach||{};
D.prof=Object.assign({name:'Jugador',fav:D.equippedSkin},D.prof);let afkGain=0;
if(D.afk&&(D.equippedSkin==='bot_2'||(D.equippedSkin==='legend_bow'&&D.equippedChar==='char_bosque'))){const s=Math.min((Date.now()-D.afk.t)/1000,28800);afkGain=Math.floor((D.afk.r||0)*s);D.coins+=afkGain}
delete D.afk;
const save=()=>{try{localStorage.setItem('woodvsbox_data',JSON.stringify(D))}catch(e){}};

// Sonido sintetizado (sin archivos externos)
let AC,muted=false;
function snd(f,d=.1,t='square',v=.04,s=0){if(muted)return;try{AC=AC||new AudioContext();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
const S={shoot:()=>snd(520,.08,'square',.025,-300),hit:()=>snd(240,.07,'sawtooth',.04,-100),kill:()=>snd(320,.16,'square',.05,-220),
coin:()=>{snd(880,.06,'triangle',.05);setTimeout(()=>snd(1320,.1,'triangle',.05),60)},hurt:()=>snd(150,.3,'sawtooth',.08,-100),
power:()=>snd(500,.18,'sine',.06,500),boss:()=>snd(90,.6,'sawtooth',.08,40),over:()=>snd(220,.7,'triangle',.08,-170)};

let st='menu',paused=false,god=false,dev=false,firing=false,tY=null,tX=null;
let p,B=[],E=[],P=[],T=[],I=[],EB=[],kc=0,kk=0,bnc=0,bT=0,bC=0,bv={x:0,y:0},clk=false,LZ=[],lzT=0,rkT=0,fc=0,bamLeft=0,bamT=0,wave,score,earned,lives,ammo,combo,comboT,rapid,cd,bot,shake=0,flash=0;
const M={x:450,y:250},K={};
const stars=[...Array(70)].map(()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.4}));

function show(id){document.querySelectorAll('.ov').forEach(o=>o.classList.toggle('on',o.id===id))}
// Sistema de logros
const ACH=[
['first','Primer golpe','Rompe tu primera caja',()=>D.st.k>=1,50],
['k100','Cazacajas','Rompe 100 cajas',()=>D.st.k>=100,200],
['k1000','Aserradero','Rompe 1.000 cajas',()=>D.st.k>=1000,2000],
['w5','Superviviente','Llega a la oleada 5',()=>D.st.w>=5,200],
['w10','Imparable','Llega a la oleada 10',()=>D.st.w>=10,1000],
['w20','Leyenda','Llega a la oleada 20',()=>D.st.w>=20,10000],
['b1','Cazajefes','Derrota a un jefe',()=>D.st.b>=1,500],
['b10','Matajefes','Derrota a 10 jefes',()=>D.st.b>=10,10000],
['b350','Exterminador','Llega a la oleada 350',()=>D.st.w>=350,1000000],
['cb5','Combo x5','Alcanza el combo máximo',()=>D.st.cb>=5,300],
['bam','¡Big Bam!','Usa el Taco Bam',()=>D.st.t>=1,5000],
['rich','Ahorrador','Ten 10.000 monedas',()=>D.coins>=10000,0],
['mil','Millonario','Ten 1.000.000 de monedas',()=>D.coins>=1e6,0],
['bil','Billonario','Ten 1 billón de monedas',()=>D.coins>=1e12,0],
['col','Coleccionista','Consigue 8 objetos',()=>D.unlockedItems.length>=8,2000],
['vet','Veterano','Juega 10 partidas',()=>D.st.r>=10,500],
['tank','Dueño del Tanque','Compra el Tanque de Guerra',()=>D.unlockedItems.includes('tank'),0]];
let tt;function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
function chk(){ACH.forEach(a=>{if(!D.ach[a[0]]&&a[3]()){D.ach[a[0]]=1;D.coins+=a[4];save();toast('🏆 '+a[1]+(a[4]?' · +'+a[4].toLocaleString('es-ES')+' 🪙':''))}})}
function renderAch(){const n=ACH.filter(a=>D.ach[a[0]]).length;$('#acn').textContent='🏆 '+n+'/'+ACH.length;$('#agrid').innerHTML=ACH.map(a=>{const u=D.ach[a[0]];return '<div class="it" style="opacity:'+(u?1:.55)+'"><div class="n" style="color:'+(u?'#ffd700':'#aab')+'">'+(u?'🏆 ':'🔒 ')+a[1]+'</div><div style="color:#aab">'+a[2]+'</div><div style="color:#ffd700">'+(a[4]?'+'+a[4].toLocaleString('es-ES')+' 🪙':'')+'</div></div>'}).join('')}

// Bot 2.0 sigue jugando (y ganando monedas) aunque salgas de la pestaña
// Música de fondo: MUSIC_SRC admite una canción incrustada (data:audio/mpeg;base64,...); en local prueba 'musica.mp3' junto al archivo
const MUSIC_SRC='';
const bgm=new Audio();bgm.loop=true;bgm.volume=.45;let bgmOn=true;
if(MUSIC_SRC)bgm.src=MUSIC_SRC;else if(location.protocol==='file:')bgm.src='musica.mp3';
function bgmPlay(){if(bgmOn&&!muted&&bgm.getAttribute('src')&&bgm.paused)bgm.play().catch(()=>{})}
['pointerdown','keydown'].forEach(n=>addEventListener(n,bgmPlay,{passive:true}));
$('#mus').onclick=()=>{bgmOn=!bgmOn;if(bgmOn)bgmPlay();else bgm.pause();$('#mus').style.opacity=bgmOn?1:.4};
$('#musb').onclick=()=>$('#musf').click();
$('#musf').onchange=e=>{const f=e.target.files[0];if(!f)return;bgm.src=URL.createObjectURL(f);bgmOn=true;$('#mus').style.opacity=1;if(!muted)bgm.play().catch(()=>{});toast('🎵 '+f.name.slice(0,30))};
let runT0=0,lastT=performance.now();
function catchUp(){const now=performance.now(),n=Math.min(Math.floor((now-lastT)/16.67),7200);lastT=now;
  if(n>2&&st==='play'&&!paused&&afk()){const m=muted;muted=true;for(let i=0;i<n&&st==='play';i++)update();muted=m;save()}}
setInterval(()=>{if(document.hidden)catchUp()},1000);
addEventListener('pagehide',()=>{if(st==='play'&&!paused&&afk()){const s=(performance.now()-runT0)/1000;if(s>15)D.afk={t:Date.now(),r:earned/s};save()}});
function loop(){lastT=performance.now();if(st==='play'&&!paused)update();draw();if(st==='shop')previews();if(st==='menu'){lobbyDraw();avDraw($('#pfc'),D.prof.fav,.7)}if(st==='prof')avDraw($('#pfa'),D.prof.fav,1.3);requestAnimationFrame(loop)}

// Entrada: ratón y táctil unificados
function aim(e){const r=C.getBoundingClientRect();M.x=(e.clientX-r.left)*W/r.width;M.y=(e.clientY-r.top)*H/r.height}
C.addEventListener('pointerdown',e=>{aim(e);if(st!=='play'||paused)return;firing=true;if(p.id==='baby_sonic'||p.id==='azulina'||p.id==='legend_bow')tp(M.x,M.y);if(e.pointerType==='touch'){tY=M.y;tX=M.x}try{C.setPointerCapture(e.pointerId)}catch(_){}clk=true;shoot();clk=false});
C.addEventListener('pointermove',e=>{aim(e);if(e.pointerType==='touch'&&firing){tY=M.y;tX=M.x}});
['pointerup','pointercancel'].forEach(n=>C.addEventListener(n,()=>{firing=false;tY=null;tX=null}));
function togglePause(){if(st==='play'){paused=!paused;firing=false;$('#pause').textContent=paused?'▶':'⏸'}}
function toggleMute(){muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(muted)bgm.pause();else bgmPlay()}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight'){K[e.key]=true;e.preventDefault()}
  const k=e.key.toLowerCase();
  if(k==='w'||k==='p')togglePause();
  if(k==='m')toggleMute();
  if(k===' '){e.preventDefault();shoot()}
  if(k==='n'&&dev&&st==='play'){E.length=0}
  if(e.key==='Escape'){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});if(st==='play'||st==='over')toMenu()}
});
addEventListener('keyup',e=>{if(e.key in K)K[e.key]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play'&&!paused&&!afk())togglePause();if(!document.hidden)catchUp()});

// Interfaz
$('#play').onclick=start;$('#again').onclick=start;$('#tomenu').onclick=toMenu;
$('#pause').onclick=togglePause;$('#mute').onclick=toggleMute;
$('#shopb').onclick=()=>{st='shop';show('shop');renderShop()};
$('#shopx').onclick=toMenu;
$('#achb').onclick=()=>{st='ach';show('ach');renderAch()};$('#achx').onclick=toMenu;
$('#pfb').onclick=()=>{st='prof';show('prof');renderProf()};$('#pfx').onclick=toMenu;
$('#pname').oninput=()=>{D.prof.name=$('#pname').value.trim().slice(0,16)||'Jugador';save()};$('#pname').onchange=pub;
$('#pfav').onchange=()=>{D.prof.fav=$('#pfav').value;save();pub()};
$('#pwep').onchange=()=>{D.equippedSkin=$('#pwep').value;save();renderProf()};
$('#phide').onclick=togHide;$('#hch').onclick=togHide;$('#lohide').onclick=togHide;
$('#pchr').onchange=()=>{D.equippedChar=$('#pchr').value||null;const w=find(D.equippedSkin);if(w.only&&D.equippedChar!==w.only)D.equippedSkin='arco_madera';save();renderProf()};
$('#lbb').onclick=async()=>{st='lb';show('lbo');await pub();renderLB()};$('#lbx').onclick=toMenu;
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{lbF=b.dataset.f;renderLB()});
$('#fs').onclick=()=>{const w=$('#wrap');document.fullscreenElement?document.exitFullscreen():(w.requestFullscreen&&w.requestFullscreen().catch(()=>{}))};
$('#devb').onclick=()=>$('#dv').classList.toggle('on');
$('#codeok').onclick=()=>{if($('#code').value==='0905'){dev=true;lobby();$('#dt').classList.add('on');$('#code').value=''}else{$('#code').value='';$('#code').placeholder='Incorrecto'}};
$('#d1').onclick=()=>{D.coins+=3000;save();chk()};$('#d3').onclick=()=>{D.coins+=1000000;save();chk()};$('#d4').onclick=()=>{D.coins+=1e12;save();chk()};
$('#d2').onclick=()=>{god=!god;$('#d2').textContent='Invencible: '+(god?'sí':'no');lobby()};
function renderShop(){
  $('#sc').textContent=D.coins.toLocaleString('es-ES');
  $('#grid').innerHTML=ITEMS.map(i=>{
    const own=D.unlockedItems.includes(i.id),eq=i.type==='char'?D.equippedChar===i.id:D.equippedSkin===i.id;
    let b;
    if(i.type==='char')b=eq?'<button class="b eq" data-a="un" data-i="'+i.id+'">Quitar</button>':own?'<button class="b" data-a="eq" data-i="'+i.id+'">Equipar</button>':'<button class="b" data-a="buy" data-i="'+i.id+'"'+(D.coins<i.price?' disabled':'')+'>Comprar</button>';
    else if(i.type==='skin')b=eq?'<button class="b eq" disabled>Equipado</button>':own?`<button class="b" data-a="eq" data-i="${i.id}">Equipar</button>`:`<button class="b" data-a="buy" data-i="${i.id}"${D.coins<i.price?' disabled':''}>Comprar</button>`;
    else b=own?'<button class="b eq" disabled>Activo</button>':`<button class="b" data-a="buy" data-i="${i.id}"${D.coins<i.price?' disabled':''}>Comprar</button>`;
    if(i.only&&own&&!eq&&D.equippedChar!==i.only)b='<button class="b" disabled>Solo con '+find(i.only).name.replace(/^\S+\s/,'')+'</button>';
    return `<div class="it"><div class="n" style="color:${i.color||'#fff'}">${i.name}</div>${i.type!=='up'?'<canvas class="pv" width="240" height="96" data-i="'+i.id+'"></canvas>':''}<div style="color:#aab">${i.desc||''}</div><div style="color:#ffd700">${own?'ADQUIRIDO':i.price.toLocaleString('es-ES')+' 🪙'}</div>${b}</div>`}).join('');
}
$('#grid').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const i=find(b.dataset.i);
  if(b.dataset.a==='buy'&&D.coins>=i.price&&!D.unlockedItems.includes(i.id)){D.coins-=i.price;D.unlockedItems.push(i.id);S.coin();chk();if(i.type==='skin'&&!i.only)D.equippedSkin=i.id;if(i.type==='char')D.equippedChar=i.id}
  if(b.dataset.a==='eq'){if(i.type==='char')D.equippedChar=i.id;else D.equippedSkin=i.id}if(b.dataset.a==='un')D.equippedChar=null;
  save();renderShop();
};
toMenu();init();loop();
if(afkGain>0)toast('😴 Mientras no estabas, tu personaje automático ganó +'+afkGain.toLocaleString('es-ES')+' 🪙');
save();chk();pub();
